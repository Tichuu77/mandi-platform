syntax = "proto3";

package mandi.user;

import "common.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
}

message CreateUserRequest {
  string tenant_id = 1;
  string name = 2;
  string email = 3;
  string password = 4;
  string phone = 5;
  string role = 6; // admin, manager, dataentry, accountant, viewer
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}

message GetUserRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message GetUserResponse {
  bool success = 1;
  User user = 2;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string role = 6;
  repeated string permissions = 7;
  string status = 8;
  common.Timestamp created_at = 9;
  common.Timestamp last_login = 10;
}

message UpdateUserRequest {
  string user_id = 1;
  string tenant_id = 2;
  string name = 3;
  string phone = 4;
  string role = 5;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
}

message DeleteUserRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message ListUsersRequest {
  string tenant_id = 1;
  common.PaginationRequest pagination = 2;
  string role = 3; // Filter by role
}

message ListUsersResponse {
  bool success = 1;
  repeated User users = 2;
  common.PaginationMeta meta = 3;
}

message AssignRoleRequest {
  string user_id = 1;
  string tenant_id = 2;
  string role = 3;
}

message AssignRoleResponse {
  bool success = 1;
  string message = 2;
}