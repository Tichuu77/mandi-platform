syntax = "proto3";

package mandi.tenant;

import "common.proto";

service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc ActivateTenant(ActivateTenantRequest) returns (ActivateTenantResponse);
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse);
}

message CreateTenantRequest {
  string mandi_name = 1;
  string owner_name = 2;
  string email = 3;
  string phone = 4;
  string gst_number = 5;
  common.Address address = 6;
}

message CreateTenantResponse {
  bool success = 1;
  string message = 2;
  string tenant_id = 3;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  bool success = 1;
  Tenant tenant = 2;
}

message Tenant {
  string id = 1;
  string mandi_name = 2;
  string owner_name = 3;
  string email = 4;
  string phone = 5;
  string gst_number = 6;
  common.Address address = 7;
  string status = 8;
  string subscription_id = 9;
  common.Timestamp created_at = 10;
  common.Timestamp updated_at = 11;
}

message UpdateTenantRequest {
  string tenant_id = 1;
  string mandi_name = 2;
  string phone = 3;
  common.Address address = 4;
}

message UpdateTenantResponse {
  bool success = 1;
  string message = 2;
}

message ListTenantsRequest {
  common.PaginationRequest pagination = 1;
  string status = 2; // Filter by status
}

message ListTenantsResponse {
  bool success = 1;
  repeated Tenant tenants = 2;
  common.PaginationMeta meta = 3;
}

message ActivateTenantRequest {
  string tenant_id = 1;
}

message ActivateTenantResponse {
  bool success = 1;
  string message = 2;
}

message SuspendTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message SuspendTenantResponse {
  bool success = 1;
  string message = 2;
}