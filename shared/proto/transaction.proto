syntax = "proto3";

package mandi.transaction;

import "common.proto";

service TransactionService {
  rpc CreateChallan(CreateChallanRequest) returns (CreateChallanResponse);
  rpc GetChallan(GetChallanRequest) returns (GetChallanResponse);
  rpc ListChallans(ListChallansRequest) returns (ListChallansResponse);
  rpc RecordGoodsArrival(GoodsArrivalRequest) returns (GoodsArrivalResponse);
  rpc CreateVoucher(CreateVoucherRequest) returns (CreateVoucherResponse);
}

message CreateChallanRequest {
  string tenantId = 1;
  string challanType = 2; // buyer, grower, both
  string buyerId = 3;
  string growerId = 4;
  repeated ChallanItem items = 5;
  repeated Expense expenses = 6;
}

message ChallanItem {
  string itemId = 1;
  string quality = 2;
  string size = 3;
  int32 quantity = 4;
  double rate = 5;
  double amount = 6;
  string lotNumber = 7;
}

message Expense {
  string expenseType = 1;
  double amount = 2;
}

message CreateChallanResponse {
  bool success = 1;
  string message = 2;
  string challanId = 3;
  string challanNo = 4;
}

message GetChallanRequest {
  string tenantId = 1;
  string challanId = 2;
}

message GetChallanResponse {
  bool success = 1;
  Challan challan = 2;
}

message Challan {
  string id = 1;
  string tenantId = 2;
  string challanNo = 3;
  string challanDate = 4;
  string buyerId = 5;
  string growerId = 6;
  repeated ChallanItem items = 7;
  double grossAmount = 8;
  double apmcCharges = 9;
  double discount = 10;
  double netAmount = 11;
  string paymentStatus = 12;
  double paidAmount = 13;
  string status = 14;
}

message ListChallansRequest {
  string tenantId = 1;
  common.PaginationRequest pagination = 2;
  string buyerId = 3;
  string startDate = 4;
  string endDate = 5;
}

message ListChallansResponse {
  bool success = 1;
  repeated Challan challans = 2;
  common.PaginationMeta meta = 3;
}

message GoodsArrivalRequest {
  string tenantId = 1;
  string growerId = 2;
  string truckNumber = 3;
  string grNumber = 4;
  repeated ArrivalItem items = 5;
}

message ArrivalItem {
  string itemId = 1;
  int32 quantity = 2;
  string lotNumber = 3;
  string storeId = 4;
}

message GoodsArrivalResponse {
  bool success = 1;
  string message = 2;
  string arrivalId = 3;
}

message CreateVoucherRequest {
  string tenantId = 1;
  string voucherType = 2; // payment, receipt, journal, contra
  string debitAccount = 3;
  string creditAccount = 4;
  double amount = 5;
  string paymentMode = 6;
  string referenceNo = 7;
  string narration = 8;
}

message CreateVoucherResponse {
  bool success = 1;
  string message = 2;
  string voucherId = 3;
  string voucherNo = 4;
}